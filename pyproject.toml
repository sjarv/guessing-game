[project]
name = "guessing-game"
version = "0.1.0"
description = "A CLI number-guessing game with distance-based hints."
readme = "README.md"
authors = [
    { name = "sjarv", email = "samanthakjarvis@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
guessing-game = "guessing_game:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.mypy]
strict = true 
